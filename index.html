<!DOCTYPE html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مغامرة الهضم</title>
<style>
body{margin:0;background:#eef7ff;font-family:Tahoma;color:#18324b}header{background:#17669b;color:white;text-align:center;padding:25px;border-bottom:6px solid #ffbd35}h1{font-size:clamp(24px,5vw,38px);margin:0}main{max-width:900px;margin:20px auto;padding:12px}.stats,nav,.opts{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.stats div{background:white;border:2px solid #d4e7f5;border-radius:12px;padding:10px;text-align:center;flex:1}.stats b{display:block;color:#17669b;font-size:22px}nav{margin:16px 0}button{font: bold 16px Tahoma;padding:12px 15px;border:0;border-radius:12px;cursor:pointer}.tab{background:#d6eafa;color:#17466c}.active,.primary{background:#17669b;color:white}.panel{background:white;border:2px solid #d4e7f5;border-radius:20px;padding:22px}h2{color:#17669b}.q{font-size:22px;line-height:1.7;font-weight:bold;margin:20px 0}.opt{background:#f1f8ff;border:2px solid #c7e1f4;color:#17466c;flex:1;min-width:200px;text-align:right}.good{background:#d8f6e5!important;border-color:#16875a!important}.bad{background:#ffe3e3!important;border-color:#c43e3e!important}.feedback{min-height:35px;font-weight:bold;margin:15px 0}.bar{height:9px;background:#e5edf3;border-radius:10px;margin:10px 0}.bar span{display:block;background:#34a875;height:100%;border-radius:10px}.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match button{background:#f1f8ff;border:2px solid #c7e1f4;color:#17466c}.sel{background:#fff1b4!important}.done{background:#d8f6e5!important}footer{text-align:center;color:#667;margin:20px}@media(max-width:550px){.match{grid-template-columns:1fr}.stats{font-size:13px}}
</style><body><header><h1>🧪 مغامرة الهضم الكيميائي</h1><p>تعلم باللعب: الأنزيمات، الأغذية، ونواتج الهضم</p></header><main>
<div class="stats"><div>⭐ النقاط<b id="score">0</b></div><div>🎯 الصحيحة<b id="correct">0</b></div><div>🏅 المستوى<b id="rank">متعلم</b></div></div>
<nav><button class="tab active" onclick="go('quiz',this)">🧠 أسئلة</button><button class="tab" onclick="go('tf',this)">✅ صح/خطأ</button><button class="tab" onclick="go('match',this)">🔗 مطابقة</button><button class="tab" onclick="go('chain',this)">🧩 التحولات</button><button class="tab" onclick="go('rapid',this)">⚡ سريع</button></nav><section class="panel" id="app"></section></main><footer>العلوم الطبيعية — الهضم الكيميائي</footer>
<script>
const Q=[
["ما الهضم الكيميائي؟",["تفكيك الأغذية المعقدة إلى مغذيات بسيطة بفعل الأنزيمات","طحن الطعام فقط","امتصاص الماء"],0,"الهضم الكيميائي يتم بفعل الأنزيمات."],
["ما الأنزيم الذي يهضم النشاء؟",["الأميلاز","الليباز","البروتياز"],0,"الأميلاز يحول النشاء إلى مالتوز."],
["ما ناتج هضم النشاء بفعل الأميلاز؟",["مالتوز","جلوكوز وفركتوز","أحماض أمينية"],0,"الناتج هو المالتوز."],
["أي أنزيم يحول المالتوز إلى جلوكوز؟",["المالتاز","اللاكتاز","السكراز"],0,"المالتاز يحول المالتوز إلى جلوكوز."],
["اللاكتوز يتحول إلى…",["جلوكوز + جلاكتوز","جلوكوز + فركتوز","مالتوز"],0,"اللاكتاز يفكك اللاكتوز إلى جلوكوز وجلاكتوز."],
["ما الأنزيم الذي يهضم السكروز؟",["السكراز","الأميلاز","الليباز"],0,"السكراز يحول السكروز إلى جلوكوز وفركتوز."],
["ما نواتج هضم السكروز؟",["جلوكوز + فركتوز","جلوكوز + جلاكتوز","أحماض دسمة"],0,"الناتج جلوكوز وفركتوز."],
["ما الأنزيم المسؤول عن هضم الدسم؟",["الليباز","البروتياز","المالتاز"],0,"الليباز يهضم الدسم."],
["ما نواتج هضم الدسم؟",["أحماض دسمة + جليسرول","أحماض أمينية","جلوكوز"],0,"ينتج أحماض دسمة وجليسرول."],
["ما الأنزيم الذي يهضم البروتينات؟",["البروتياز","الليباز","الأميلاز"],0,"البروتياز يساهم في هضم البروتينات."],
["ما الناتج النهائي لهضم البروتينات؟",["أحماض أمينية","مالتوز","جليسرول"],0,"تتحول البروتينات إلى أحماض أمينية."],
["أين يتم معظم امتصاص المغذيات؟",["المعي الدقيق","المعدة","المريء"],0,"يتم معظم الامتصاص في المعي الدقيق."]
];
const T=[["الأميلاز يحول النشاء إلى مالتوز.",true,"صحيح."],["المالتاز يحول المالتوز إلى جلوكوز.",true,"صحيح."],["اللاكتاز ينتج جلوكوز وفركتوز.",false,"اللاكتاز ينتج جلوكوز وجلاكتوز."],["السكراز يهضم السكروز.",true,"صحيح."],["الليباز يهضم البروتينات.",false,"الليباز يهضم الدسم."],["نواتج هضم الدسم أحماض دسمة وجليسرول.",true,"صحيح."],["البروتياز يهضم البروتينات.",true,"صحيح."],["يتم معظم الامتصاص في المعي الغليظ.",false,"يتم معظم الامتصاص في المعي الدقيق."]];
const P=[["النشاء","الأميلاز"],["المالتوز","المالتاز"],["اللاكتوز","اللاكتاز"],["السكروز","السكراز"],["الدسم","الليباز"],["البروتينات","البروتياز"]];
const C=[["النشاء","الأميلاز","مالتوز"],["المالتوز","المالتاز","جلوكوز"],["اللاكتوز","اللاكتاز","جلوكوز + جلاكتوز"],["السكروز","السكراز","جلوكوز + فركتوز"],["الدسم","الليباز","أحماض دسمة + جليسرول"],["البروتينات","البروتياز","أحماض أمينية"]];
let points=0,correct=0,i=0,j=0,locked=false,sel=null,done=new Set(),timer=null;
let quizOrder=[], chainOrder=[], rapidOrder=[];
function shuffled(arr){return arr.map((v,k)=>({v,k})).sort(()=>Math.random()-.5)}
const app=document.getElementById('app');
function stat(){score.textContent=points;document.getElementById('correct').textContent=correct;rank.textContent=points>100?'خبير الهضم':points>40?'باحث صغير':'متعلم'}
function go(g,b){clearInterval(timer);document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');({quiz,tf,match,chain,rapid}[g])()}
function quiz(){locked=false;let q=Q[i%Q.length];quizOrder=shuffled(q[1]);app.innerHTML=`<h2>🧠 سؤال ${i+1}</h2><div class="bar"><span style="width:${(i%Q.length+1)/Q.length*100}%"></span></div><div class="q">${q[0]}</div><div class="opts">${quizOrder.map((x,k)=>`<button class="opt" onclick="ans(${k})">${['أ','ب','ج','د'][k]}) ${x.v}</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="primary" onclick="i++;quiz()">التالي ←</button>`}
function ans(k){if(locked)return;locked=true;let q=Q[i%Q.length],o=document.querySelectorAll('.opt'),right=quizOrder.findIndex(x=>x.k===q[2]);o[right].classList.add('good');if(k===right){points+=10;correct++;fb.textContent='🎉 صحيح! '+q[3];fb.style.color='green'}else{o[k].classList.add('bad');fb.textContent='💡 '+q[3];fb.style.color='red'}stat()}
function tf(){locked=false;let x=T[j%T.length];app.innerHTML=`<h2>✅ صح أم خطأ (${j+1})</h2><div class="q">${x[0]}</div><div class="opts"><button class="opt" onclick="ta(true)">صح ✔</button><button class="opt" onclick="ta(false)">خطأ ✖</button></div><div class="feedback" id="fb"></div><button class="primary" onclick="j++;tf()">التالي ←</button>`}
function ta(v){if(locked)return;locked=true;let x=T[j%T.length];if(v===x[1]){points+=10;correct++;fb.textContent='أحسنت! '+x[2];fb.style.color='green'}else{fb.textContent=x[2];fb.style.color='red'}stat()}
function match(){sel=null;done=new Set();let l=P.map((x,k)=>({x:x[0],k})).sort(()=>Math.random()-.5),r=P.map((x,k)=>({x:x[1],k})).sort(()=>Math.random()-.5);app.innerHTML=`<h2>🔗 طابق الغذاء مع الأنزيم</h2><div class="match">${l.map(x=>`<button id="L${x.k}" onclick="pick('L',${x.k})">${x.x}</button>`).join('')}${r.map(x=>`<button id="R${x.k}" onclick="pick('R',${x.k})">${x.x}</button>`).join('')}</div><div class="feedback" id="mf">كل تطابق صحيح يمنحك 10 نقاط.</div><button class="primary" onclick="match()">إعادة ↻</button>`}
function pick(s,k){if(done.has(k))return;if(!sel){sel={s,k};document.getElementById(s+k).classList.add('sel');return}if(sel.s===s){document.getElementById(sel.s+sel.k).classList.remove('sel');sel={s,k};document.getElementById(s+k).classList.add('sel');return}document.getElementById(sel.s+sel.k).classList.remove('sel');if(sel.k===k){done.add(k);Lk=document.getElementById('L'+k);Rk=document.getElementById('R'+k);Lk.classList.add('done');Rk.classList.add('done');points+=10;correct++;mf.textContent='✔ '+P[k][0]+' ↔ '+P[k][1];if(done.size===P.length)mf.textContent='🏆 ممتاز! أكملت المطابقة.';stat()}else mf.textContent='حاول مرة أخرى، هذه ليست مطابقة صحيحة.';sel=null}
function chain(){let k=Math.floor(Math.random()*C.length),x=C[k];chainOrder=shuffled(C.map((z,n)=>z[2]));let right=chainOrder.findIndex(z=>z.k===k);app.innerHTML=`<h2>🧩 أكمل التحول</h2><div class="q">${x[0]} — (${x[1]}) → ؟</div><div class="opts">${chainOrder.map((z,n)=>`<button class="opt" onclick="ca(${n},${k})">${z.v}</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="primary" onclick="chain()">تحول جديد ↻</button>`}
function ca(n,k){let o=document.querySelectorAll('.opt'),right=chainOrder.findIndex(z=>z.k===k);if(n===right){o[n].classList.add('good');points+=10;correct++;fb.textContent='✔ صحيح: '+C[k][2]}else{o[n].classList.add('bad');o[right].classList.add('good');fb.textContent='الإجابة الصحيحة: '+C[k][2]}stat()}
function rapid(){clearInterval(timer);let sec=30,n=0,k=0;app.innerHTML=`<h2>⚡ تحدي 30 ثانية</h2><span class="badge" id="clock">30 ثانية</span><div class="q" id="rq"></div><div class="opts" id="ro"></div><div class="feedback" id="rf">ابدأ ثم أجب بسرعة!</div><button class="primary" onclick="start()">ابدأ ▶</button>`;function draw(){let x=Q[k%Q.length];rapidOrder=shuffled(x[1]);rq.textContent=x[0];ro.innerHTML=rapidOrder.map((a,b)=>`<button class="opt" onclick="ra(${b})">${a.v}</button>`).join('')}window.ra=function(b){if(!timer)return;let x=Q[k%Q.length],right=rapidOrder.findIndex(a=>a.k===x[2]);if(b===right){points+=5;correct++;n++;rf.textContent='✔ صحيح +5'}else rf.textContent='✖ الإجابة الصحيحة: '+x[1][x[2]];k++;stat();draw()};window.start=function(){clearInterval(timer);sec=30;clock.textContent='30 ثانية';draw();timer=setInterval(()=>{sec--;clock.textContent=sec+' ثانية';if(sec<=0){clearInterval(timer);timer=null;rq.textContent='انتهى الوقت!';ro.innerHTML='';rf.textContent='أجبت عن '+n+' سؤالًا وجمعت '+n*5+' نقاط.'}},1000)}}
quiz();stat();
</script></body></html>
